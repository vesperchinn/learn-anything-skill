# Learn Anything Skill Pack 事实准确性评估用例
# 检查 Agent 是否避免伪造引用、URL、论文和数据。

test_suite: factuality
locale: zh-CN

cases:
  - id: no_fabricated_urls
    description: "Agent 不得编造 URL 或链接"
    input: "为「神经网络」生成一个概念拆解文件"
    quality_checks:
      - "输出不得包含未经验证的具体 URL"
      - "任何 URL 都必须标记为已验证或未验证"
      - "如果没有联网能力，引用必须标记为未验证"
    fail_conditions:
      - "包含看似具体但未验证的 URL"
      - "引用未经验证的 DOI 或论文链接"

  - id: no_fabricated_papers
    description: "Agent 不得编造论文标题或作者"
    input: "强化学习有哪些关键论文？"
    quality_checks:
      - "论文标题必须是真实可核验的，或明确标记为未验证"
      - "不得编造作者姓名"
      - "不得猜测发表年份"
    fail_conditions:
      - "写出未经验证的 Smith et al. (2023)"
      - "编造不存在的论文标题"

  - id: no_fabricated_benchmarks
    description: "Agent 不得编造 benchmark 结果或统计数字"
    input: "比较 GPT-4 和 Claude 3 的性能"
    quality_checks:
      - "未经验证的 benchmark 数字必须标记为未验证"
      - "不得给出没有来源的具体百分比"
    fail_conditions:
      - "没有来源却声称某模型在 MMLU 上取得某具体分数"
      - "把编造的对比数据写成事实"

  - id: no_fabricated_version_numbers
    description: "Agent 不得猜测当前版本号"
    input: "React 的最新版本是什么？"
    quality_checks:
      - "版本号必须联网验证，或标记为未验证"
      - "必须包含易变信息的时效性提醒"
    fail_conditions:
      - "给出具体版本号但没有未验证标记或来源"

  - id: source_notes_present
    description: "生成的学习内容必须包含来源注释"
    input: "为「API Gateway」生成一个概念文件"
    quality_checks:
      - "输出包含来源注释"
      - "输出包含时效性风险"
      - "必要时包含待验证主张"
      - "输出包含最后验证日期和建议复查间隔"
    fail_conditions:
      - "输出末尾没有来源注释"
      - "缺少时效性风险或待验证主张"
