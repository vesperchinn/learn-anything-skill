<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="390" viewBox="0 0 1200 390"
     role="img" aria-labelledby="title desc">
  <title id="title">The learning loop adapts after every answer</title>
  <desc id="desc">The agent teaches one idea, gives a small task, checks the learner's answer, updates progress and weak points, then uses that state for the next session.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081321"/>
      <stop offset="1" stop-color="#10233A"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2DD4BF"/>
    </marker>
  </defs>

  <rect width="1200" height="390" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="388" rx="27" fill="none" stroke="#2B3D57" stroke-width="2"/>

  <g id="heading" transform="translate(56 46)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16"
          font-weight="750" letter-spacing="2.4" fill="#2DD4BF">GUIDED LEARNING LOOP</text>
    <text y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="40" font-weight="700" letter-spacing="-1" fill="#F7FAFC">Learning gets better every time you answer.</text>
  </g>

  <g id="cards" transform="translate(56 132)">
    <g id="teach">
      <rect x="5" y="7" width="238" height="148" rx="18" fill="#020814" opacity="0.45"/>
      <rect width="238" height="148" rx="18" fill="#12213A" stroke="#2B4567" stroke-width="1.5"/>
      <rect x="18" y="18" width="42" height="30" rx="10" fill="#163C45"/>
      <text x="39" y="39" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="15" font-weight="800" fill="#2DD4BF">01</text>
      <text x="18" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="24" font-weight="700" fill="#F7FAFC">Teach</text>
      <text x="18" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="18" fill="#9FB0C8">one idea in plain</text>
      <text x="18" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="18" fill="#9FB0C8">language</text>
    </g>

    <g id="try" transform="translate(282 0)">
      <rect x="5" y="7" width="238" height="148" rx="18" fill="#020814" opacity="0.45"/>
      <rect width="238" height="148" rx="18" fill="#12213A" stroke="#2B4567" stroke-width="1.5"/>
      <rect x="18" y="18" width="42" height="30" rx="10" fill="#3B3020"/>
      <text x="39" y="39" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="15" font-weight="800" fill="#F7B955">02</text>
      <text x="18" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="24" font-weight="700" fill="#F7FAFC">Try</text>
      <text x="18" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="18" fill="#9FB0C8">one task in your</text>
      <text x="18" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="18" fill="#9FB0C8">real context</text>
    </g>

    <g id="check" transform="translate(564 0)">
      <rect x="5" y="7" width="238" height="148" rx="18" fill="#020814" opacity="0.45"/>
      <rect width="238" height="148" rx="18" fill="#12213A" stroke="#2B4567" stroke-width="1.5"/>
      <rect x="18" y="18" width="42" height="30" rx="10" fill="#282D52"/>
      <text x="39" y="39" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="15" font-weight="800" fill="#AAB4FF">03</text>
      <text x="18" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="24" font-weight="700" fill="#F7FAFC">Check</text>
      <text x="18" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="18" fill="#9FB0C8">clear criteria and</text>
      <text x="18" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="18" fill="#9FB0C8">targeted feedback</text>
    </g>

    <g id="adapt" transform="translate(846 0)">
      <rect x="5" y="7" width="238" height="148" rx="18" fill="#020814" opacity="0.45"/>
      <rect width="238" height="148" rx="18" fill="#14343A" stroke="#2DD4BF" stroke-width="1.5"/>
      <rect x="18" y="18" width="42" height="30" rx="10" fill="#1B4B50"/>
      <text x="39" y="39" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="15" font-weight="800" fill="#67E8D6">04</text>
      <text x="18" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="24" font-weight="700" fill="#F7FAFC">Adapt</text>
      <text x="18" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="18" fill="#A8C9C9">progress and weak</text>
      <text x="18" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="18" fill="#A8C9C9">points update</text>
    </g>

    <path d="M246 74H272M528 74H554M810 74H836" stroke="#2DD4BF" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g id="feedback-loop">
    <path d="M1036 300 C1014 350 210 350 174 300" fill="none" stroke="#2DD4BF" stroke-width="3"
          stroke-dasharray="7 9" marker-end="url(#arrow)" opacity="0.9"/>
    <rect x="360" y="315" width="480" height="38" rx="19" fill="#0C1A2D" stroke="#263D59"/>
    <text x="600" y="340" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="17" font-weight="650" fill="#B9C8DA">NEXT SESSION STARTS FROM WHAT YOU ACTUALLY KNOW</text>
  </g>

  <text x="600" y="374" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="15" fill="#7890AD">SOURCES CHECKED · FRESHNESS TRACKED · ANSWERS STAY HIDDEN UNTIL YOU TRY</text>
</svg>
