<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="460" viewBox="0 0 1200 460"
     role="img" aria-labelledby="title desc">
  <title id="title">Learn Anything Skill Pack</title>
  <desc id="desc">Learn Anything: turn any AI agent into a guided learning coach. Poster-style hero with the project's real artifacts — domain map, progress tracker, and Day 1 guided session — as printed scraps.</desc>

  <defs>
    <pattern id="grain" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1E2421" opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1200" height="460" rx="26" fill="#F6EFE2"/>
  <rect width="1200" height="460" rx="26" fill="url(#grain)"/>
  <rect x="1" y="1" width="1198" height="458" rx="25" fill="none" stroke="#DED2BA" stroke-width="2"/>

  <!-- Eyebrow -->
  <rect x="64" y="60" width="16" height="16" fill="#E8A33D"/>
  <text x="92" y="75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="5" fill="#6E675A">AGENT SKILL PACK · OPEN SOURCE</text>

  <!-- Giant stacked display type -->
  <text x="60" y="212" font-family="Georgia, 'Songti SC', serif" font-size="132" font-weight="700" fill="#1E2421">Learn</text>
  <rect x="56" y="252" width="588" height="80" fill="#E8A33D"/>
  <text x="60" y="320" font-family="Georgia, 'Songti SC', serif" font-size="132" font-weight="700" fill="#1E2421">Anything</text>

  <!-- One-line promise -->
  <text x="64" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="23" fill="#3A4148">Turn any AI agent into a guided learning coach.</text>
  <text x="64" y="428" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#6E675A">MIT · v0.2.4-beta · en-US / zh-CN · 10+ agent platforms</text>

  <!-- Collage of real project artifacts -->
  <g transform="rotate(-2.5 930 130)">
    <rect x="751" y="70" width="370" height="132" rx="10" fill="#1E2421" opacity="0.07"/>
    <rect x="745" y="64" width="370" height="132" rx="10" fill="#FFFFFF" stroke="#E3D9C4" stroke-width="1.5"/>
    <text x="769" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#C77F22">00_domain_map.md</text>
    <text x="769" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#6E675A">├── 01_core_concepts/</text>
    <text x="769" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#6E675A">├── 06_quizzes/</text>
    <text x="769" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#6E675A">└── 09_sources/</text>
  </g>

  <g transform="rotate(2 970 270)">
    <rect x="796" y="206" width="365" height="140" rx="10" fill="#1E2421" opacity="0.07"/>
    <rect x="790" y="200" width="365" height="140" rx="10" fill="#FFFFFF" stroke="#E3D9C4" stroke-width="1.5"/>
    <text x="814" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#1E2421">progress.md</text>
    <text x="814" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" fill="#2E6B4F">✓ Day 1 · harness basics</text>
    <text x="814" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" fill="#2E6B4F">✓ Day 2 · one-step checks</text>
    <text x="814" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16" fill="#9A937F">☐ Day 3 · stage test</text>
  </g>

  <!-- DAY 01 stamp -->
  <g transform="rotate(-6 850 385)">
    <rect x="758" y="358" width="190" height="66" rx="8" fill="#1E2421" opacity="0.10"/>
    <rect x="752" y="352" width="190" height="66" rx="8" fill="#2E6B4F"/>
    <text x="847" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="700" fill="#F6EFE2" text-anchor="middle">DAY 01</text>
    <text x="847" y="406" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2" fill="#BFD4C8" text-anchor="middle">GUIDED SESSION</text>
  </g>
</svg>
